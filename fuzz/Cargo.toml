[package]
name = "star-lang-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
star-compiler = { path = "../crates/star-compiler" }
star-lexer = { path = "../crates/star-lexer" }
star-parser = { path = "../crates/star-parser" }

[[bin]]
name = "source_parser"
path = "fuzz_targets/source_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bytecode_verifier"
path = "fuzz_targets/bytecode_verifier.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
