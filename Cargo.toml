[workspace]
members = [
    "crates/star-common",
    "crates/star-lexer",
    "crates/star-parser",
    "crates/star-interpreter",
    "crates/star-compiler",
    "crates/star-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
star-common = { path = "crates/star-common" }
star-lexer = { path = "crates/star-lexer" }
star-parser = { path = "crates/star-parser" }
star-compiler = { path = "crates/star-compiler" }
cap-std = "4.0.3"
httparse = "1.10"
http = "1.4"
num-bigint = "0.5"
num-traits = "0.2"
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
sha2 = "0.11.2"
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
star-interpreter = { path = "crates/star-interpreter" }
