# Opcodes such as NE, GTE, LTE, INC, and DEC are expressible through existing
# instructions and do not receive dedicated values in this catalog.
# The historical 0x80-0x86 VM candidates are not source assignments.
# TRY/CATCH/FINALLY use source-only values 0x87-0x89; bytecode regions are
# represented by ExceptionTable records rather than these source opcode values.
[[pending_assignments]]
family = "exceptions"
candidate_opcodes = [0x80, 0x81, 0x82, 0x83, 0x84, 0x85, 0x86]
reference = "programming/exceptions.md"
reason = "The source document identifies these as VM opcodes; this catalog is source-only."
