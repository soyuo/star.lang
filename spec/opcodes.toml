schema_version = 1
status = "draft"
namespace = "source"

# This catalog describes source-level Star instructions only.
# .starc VM bytecode has an independent opcode namespace and must not reuse
# these values by assumption.

[encoding]
allowed_characters = ["*", "'", '"']
bit_zero = "'"
bit_one = "*"
basic_form = "N asterisks followed by a single quote; N is the basic ordinal."
extended_form = "Single quote, 8 payload bits (most significant bit first), double quote."
whitespace = "Spaces, tabs, CR, and LF are formatting only in normal mode."
literal_form = "Double quote, encoded data bits, double quote."

[allocation]
"0x00-0x0F" = "Reserved: stack and basic execution control; no source assignments yet."
"0x10-0x1F" = "Type conversion and type operations."
"0x20-0x2F" = "Arithmetic, logical, and bitwise operations."
"0x30-0x3F" = "Conditionals and loops."
"0x40-0x4F" = "Functions and calls."
"0x50-0x5F" = "Variables and scope."
"0x60-0x6F" = "Arrays, maps, sets, and strings."
"0x70-0x7F" = "Structs and objects."
"0x80-0x8F" = "Exception handling."
"0x90-0x9F" = "Modules and libraries."
"0xA0-0xAF" = "Asynchronous operations and concurrency."
"0xB0-0xBF" = "Native interface."
"0xC0-0xCF" = "Reserved: debugging and diagnostics."
"0xD0-0xFE" = "Reserved for future expansion."
"0xFF" = "Reserved as an extended-instruction page prefix."

