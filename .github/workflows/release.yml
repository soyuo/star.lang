name: Cross-platform release

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'scripts/install.sh'
      - 'scripts/install.ps1'
      - 'scripts/package_release.py'
      - 'LICENSE'
      - 'README.md'
  push:
    branches: [develop]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set deterministic package timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Build CLI
        run: cargo build --locked --release --package star-cli --target ${{ matrix.target }}
      - name: Package standalone CLI
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/star"
          if [[ '${{ matrix.target }}' == *windows* ]]; then binary+='.exe'; fi
          python scripts/package_release.py \
            --target '${{ matrix.target }}' \
            --binary "$binary" \
            --output-dir dist \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
      - uses: actions/upload-artifact@v4
        with:
          name: star-${{ matrix.target }}
          path: dist/star-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: star-*
          path: release-assets
          merge-multiple: true
      - name: Add installers and checksums
        run: |
          cp scripts/install.sh scripts/install.ps1 release-assets/
          cd release-assets
          sha256sum star-*.tar.gz star-*.zip > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "Star $GITHUB_REF_NAME" --generate-notes
